<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<meta name="koa-offline" content="1">
<title>Koa: learn the ukulele</title>
<meta name="description" content="Koa teaches you the ukulele, from your first chord to your first song. It runs in your browser and works offline.">
<meta property="og:title" content="Koa: learn the ukulele">
<meta property="og:description" content="Lessons, songs, chord and rhythm practice, and a tuner. It runs in your browser and works offline.">
<meta property="og:type" content="website">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE4; --sheet:#FBF7F0; --ink:#2B2520; --soft:#5D554B; --faint:#726A61;
  --nylon:#D5CBBA; --rule:#E6DDCF; --koa:#9C5C2A; --koa-soft:rgba(156,92,42,.11); --on-koa:#FBF7F0;
  --good:#537446; --off:#A55537; --dstr:#BFB3A0; --dfret:#D9CEBC; --neck:#EEE5D4; --hand:#F3E6D6; --glow:rgba(176,112,52,.10); --grain:.55; --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 28px rgba(60,40,20,.06);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:68px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#1B1714; --sheet:#24201C; --ink:#EEE6D8; --soft:#A79B8C; --faint:#8A8177;
  --nylon:#4A423B; --rule:#312A25; --koa:#D4904F; --koa-soft:rgba(212,144,79,.14); --on-koa:#1B1714;
  --good:#90AF7D; --off:#DD8C6C; --glow:rgba(212,144,79,.07); --grain:.35; --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25); color-scheme:dark; --dstr:#7D7266; --dfret:#4E453D; --neck:#332C26; --hand:#3B312A; } }
:root[data-theme="dark"]{
  --paper:#1B1714; --sheet:#24201C; --ink:#EEE6D8; --soft:#A79B8C; --faint:#8A8177;
  --nylon:#4A423B; --rule:#312A25; --koa:#D4904F; --koa-soft:rgba(212,144,79,.14); --on-koa:#1B1714;
  --good:#90AF7D; --off:#DD8C6C; --glow:rgba(212,144,79,.07); --grain:.35; --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25); color-scheme:dark; --dstr:#7D7266; --dfret:#4E453D; --neck:#332C26; --hand:#3B312A; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(130% 55% at 50% -12%,var(--glow),transparent 62%) no-repeat,var(--paper)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--koa);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:16px 24px calc(var(--nav-h) + 56px)}
/* type */
.serif{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-optical-sizing:auto}
.t-hero{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:350;font-size:61px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-display{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:400;font-size:39px;line-height:1.08;letter-spacing:-.015em;margin:0}
.t-title{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:400;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin:0}
.soft{color:var(--soft)} .faint{color:var(--faint)} .small{font-size:14px} .center{text-align:center}
.label{font-size:13px;font-weight:500;color:var(--soft);margin:34px 0 12px;letter-spacing:.01em}
.lede{color:var(--soft);margin:0 0 22px;max-width:46ch}
p{margin:0}
/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:48px;margin-bottom:14px}
.mark{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:23px;font-weight:450;letter-spacing:-.01em}
.mark svg{display:block}
.hright{display:flex;align-items:center;gap:6px}
.micpill{display:none;align-items:center;gap:7px;background:var(--sheet);border:0;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--soft);box-shadow:var(--shadow)}
.micpill.on{display:inline-flex}
.micpill i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--soft)}
.icon-btn:hover{color:var(--ink);background:var(--koa-soft)}
.icon-btn[aria-pressed="true"]{color:var(--koa);background:var(--koa-soft)}
.icon-btn.sm{width:36px;height:36px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;line-height:1.2;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--koa);color:var(--on-koa)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--nylon)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--soft)}
.btn.quiet{background:transparent;color:var(--soft);padding:12px 10px}
.btn.quiet:hover{color:var(--ink)}
.btn.wide{width:100%;padding:18px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* tabs (one underline language, like a string) */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin:0 0 24px}
.tabs button{background:none;border:0;padding:10px 0 12px;font-size:15px;color:var(--soft);position:relative}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--koa)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chips button{background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px;padding:7px 15px;font-size:14px;color:var(--soft)}
.chips button[aria-pressed="true"]{background:var(--koa-soft);box-shadow:none;color:var(--ink)}
/* switch */
.switch{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:8px 0;font-size:15px;color:var(--ink);text-align:left}
.switch .sw{flex:0 0 auto;width:36px;height:22px;border-radius:999px;background:var(--nylon);position:relative;transition:background .18s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch[aria-checked="true"] .sw{background:var(--koa)}
.switch[aria-checked="true"] .sw::after{transform:translateX(14px)}
.optlist{border-top:1px solid var(--rule);margin-top:26px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.opt .switch{flex:1;min-width:0}
.opt .hint{display:block;font-size:12px;color:var(--faint)}
.opt select{max-width:110px}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:var(--koa-soft);margin:0 0 18px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-size:14px;color:var(--soft);transition:background .15s,color .15s}
.seg2 button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.12)}
select,input[type=number],input[type=text],textarea{background:var(--sheet);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;padding:9px 12px}
input[type=number]{width:80px;text-align:center}
textarea{width:100%;min-height:220px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:6px 0 4px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--nylon);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--nylon);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:var(--koa);border:3px solid var(--paper)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--koa);border:3px solid var(--paper)}
.note{font-size:14px;color:var(--soft);min-height:22px;margin-top:12px}
.note.good{color:var(--good)} .note.off{color:var(--off)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nodia{font-size:12px;color:var(--faint);display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.15;border:1px dashed var(--nylon);border-radius:12px;margin:0 auto;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 22px}
/* nav */
nav.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock .bar{pointer-events:auto;max-width:420px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr);border-radius:24px;
  background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow),inset 0 0 0 1px var(--rule)}
.dock button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--faint);position:relative;border-radius:20px}
.dock button[aria-current="page"]{color:var(--ink)}
.dock button[aria-current="page"] svg{color:var(--koa)}
.dock button[aria-current="page"]::after{content:"";position:absolute;bottom:7px;width:4px;height:4px;border-radius:50%;background:var(--koa)}
.dock button[aria-current="page"] span{transform:translateY(-3px)}
.dock button span,.dock button svg{transition:transform .2s ease}
.dock button[aria-current="page"] svg{transform:translateY(-3px)}
/* sections */
main > section{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* learn */
.today{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 22px}
.streak{display:flex;align-items:baseline;gap:10px}
.streak .small{color:var(--soft)}
.dots{display:flex;gap:9px;align-items:flex-end}
.dots div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
.dots i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--nylon)}
.dots i.on{background:var(--koa);box-shadow:none}
.dots i.now{box-shadow:inset 0 0 0 1.5px var(--koa)}
.dots i.now.on{box-shadow:none}
.card{background:var(--sheet);border-radius:26px;padding:26px 26px 22px;box-shadow:var(--shadow)}
.continue{position:relative}
.continue .num{font-size:13px;color:var(--koa);font-weight:500;margin-bottom:10px}
.tunechip{position:absolute;top:20px;right:20px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;background:var(--koa-soft);color:var(--ink)}
.tunechip:hover{background:var(--rule)}
.continue .t-title{margin-bottom:10px}
.continue p.d{color:var(--soft);max-width:44ch}
.meter{height:3px;border-radius:3px;background:var(--rule);margin:22px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--koa);border-radius:3px;transition:width .6s ease}
.continue .goal{font-size:13px;color:var(--soft);margin-bottom:18px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:11px;top:16px;bottom:16px;width:1.5px;background:var(--nylon)}
.step{position:relative}
.step-h{width:100%;display:grid;grid-template-columns:24px 1fr;column-gap:16px;align-items:baseline;background:none;border:0;padding:11px 0;text-align:left}
.node{grid-row:span 2;align-self:start;margin-top:4px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--nylon);display:grid;place-items:center;color:var(--on-koa);position:relative;z-index:1}
.step.done .node{background:var(--koa);box-shadow:none}
.step.current .node{box-shadow:inset 0 0 0 2px var(--koa)}
.step.current .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--koa)}
.st-t{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:19px;line-height:1.3}
.st-g{grid-column:2;font-size:13px;color:var(--soft)}
.step.done .st-t{color:var(--soft)}
.step-b{padding:0 0 16px 40px}
.step-b p{color:var(--soft);margin-bottom:14px;max-width:48ch}
/* tune */
.tuner-note.idle{color:var(--faint)}
.tuner-note{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:350;font-size:132px;line-height:1;text-align:center;margin:18px 0 8px;transition:color .25s}
.tuner-cents{text-align:center;color:var(--soft);min-height:26px;font-variant-numeric:tabular-nums}
.wave{display:block;width:100%;height:84px;margin:22px 0 28px}
.strings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px}
.strings button{background:var(--sheet);border:0;border-radius:18px;padding:16px 0 12px;font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:28px;line-height:1;box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .15s,color .15s}
.strings button small{display:block;font-family:var(--sans);font-size:12px;color:var(--faint);margin-top:7px}
.strings button.hit{box-shadow:inset 0 0 0 1.5px var(--koa)}
.strings button.done{color:var(--good)}
/* practice: chords */
.focus{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:center;margin:0 0 6px}
.focus .big{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:350;font-size:84px;line-height:.95;letter-spacing:-.02em}
.focus .meta{color:var(--soft);font-size:14px;margin:8px 0 10px}
.actions{margin:6px 0 0}
.cgroup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px}
@media (min-width:560px){ .cgroup{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))} }
.ctile{background:transparent;border:0;border-radius:16px;padding:10px 4px 8px;text-align:center;transition:background .15s}
.ctile:hover{background:var(--koa-soft)}
.ctile[aria-pressed="true"]{background:var(--sheet);box-shadow:var(--shadow)}
.ctile .nm{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:19px;line-height:1.1;display:flex;justify-content:center;align-items:center;gap:5px}
.ctile .nm i{width:5px;height:5px;border-radius:50%;background:var(--good)}
/* practice: changes */
.trainer{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin:4px 0 22px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 6px;border-radius:20px;transition:background .2s,box-shadow .2s}
.side.cur{background:var(--sheet);box-shadow:var(--shadow)}
.side select{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:22px;padding:4px 6px;width:100%;max-width:96px;text-align:center;text-align-last:center;background:transparent;box-shadow:none}
.side select:hover{box-shadow:inset 0 0 0 1px var(--rule)}
.side .dia{width:100%;max-width:84px}
.ringwrap{position:relative;width:min(184px,46vw);aspect-ratio:1}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .track{stroke:var(--rule)}
.ring .prog{stroke:var(--koa);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc b{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:350;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.ringc span{font-size:13px;color:var(--soft)}
.ringc .clk{margin-top:6px;font-variant-numeric:tabular-nums;color:var(--faint)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 18px}
.duo .slot{text-align:center;border-radius:18px;padding:10px 0 4px;transition:background .2s,box-shadow .2s}
.duo .slot.cur{background:var(--sheet);box-shadow:var(--shadow)}
.duo .slot .nm{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:26px;line-height:1}
.chart{width:100%;height:auto;display:block}
.bests{list-style:none;margin:0;padding:0}
.bests li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.bests li .p{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:18px}
.empty{color:var(--soft);font-size:14px}
/* practice: rhythm */
.grid8{display:grid;text-align:center;margin:4px 0 26px;gap:2px}
.grid8 .ct{font-size:13px;color:var(--faint);padding-bottom:6px}
.grid8 .ar{font-size:34px;line-height:1.2;transition:color .08s}
.grid8 .ar.ghost{color:var(--faint);opacity:.7}
.grid8 .cell{padding:10px 0;border-radius:14px}
.grid8 .cell.now{background:var(--sheet);box-shadow:var(--shadow)}
.grid8 .cell.now .ar:not(.ghost),.grid8 .cell.now .ct{color:var(--koa)}
.tab{display:grid;row-gap:0;margin:4px 0 26px;align-items:center}
.tab .sl{font-family:var(--serif);font-size:15px;color:var(--soft)}
.tab .tc{height:36px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:10px}
.tab .tc::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--nylon)}
.tab .tc i{position:relative;border-radius:50%;background:var(--ink)}
.tab .tc.now{background:var(--koa-soft)}
.tab .tc.now i{background:var(--koa)}
.tab .cnt{font-size:13px;color:var(--faint);text-align:center;padding-bottom:4px}
.tab .cnt.now{color:var(--koa)}
.legend{font-size:14px;color:var(--soft);text-align:center;margin:18px auto 4px;max-width:40ch}
#rTransport{margin:0}
.grid8,.tab{margin-bottom:18px}
.tempo{display:flex;align-items:center;justify-content:center;gap:14px}
.bpmv{display:flex;align-items:baseline;gap:6px;min-width:96px;justify-content:center}
.bpmv b{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:350;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.bpmv span{color:var(--soft);font-size:14px}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--koa);color:var(--on-koa);display:inline-grid;place-items:center;box-shadow:var(--shadow);transition:transform .12s}
.play:active{transform:scale(.96)}
.play.sm{width:54px;height:54px}
/* songs */
.songs{list-style:none;padding:0;margin:0}
.songs li{border-bottom:1px solid var(--rule)}
.tabs + .songs li:first-child{border-top:0}
.song{width:100%;background:none;border:0;text-align:left;padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.song .s-t{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:21px;line-height:1.25;display:block}
.song .s-m{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:4px}
.song .cn b{font-weight:500;color:var(--ink);margin-right:6px}
.song .cn b.no{color:var(--faint);font-weight:400}
